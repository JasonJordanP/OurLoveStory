<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF0EE;
    --surface: #FFFFFF;
    --surface-2: #F3D6DE;
    --paper: #6B2942;
    --paper-dim: #B98A96;
    --gold: #C85379;
    --sage: #DFA0B0;
    --line: #EAC3CC;
    --shadow: rgba(150,60,90,0.18);
    --font-display: 'Fraunces', serif;
    --font-body: 'Work Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: var(--font-body);
    min-height: 100%;
  }

  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(200,83,121,0.09), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(223,160,176,0.14), transparent 40%);
    padding: 40px 20px 80px;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .page-title {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 26px;
  }
  .page-title-text {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(32px, 7vw, 48px);
    color: var(--gold);
    text-align: center;
    margin: 0;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  @media (max-width: 480px) {
    .page-title { margin-bottom: 20px; }
  }

  .intro-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    box-sizing: border-box;
    text-align: center;
  }
  .intro-message-display {
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    color: var(--paper);
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 600px;
    margin-bottom: 22px;
  }
  .intro-message-display.placeholder { color: var(--paper-dim); font-style: italic; }
  .intro-textarea-wrap {
    position: relative;
    width: min(560px, 90vw);
    margin: 0 auto 20px;
  }
  .intro-textarea {
    width: 100%;
    min-height: 150px;
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding: 14px 46px 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--paper);
    resize: vertical;
    box-sizing: border-box;
    display: block;
  }
  .intro-textarea:focus { outline: none; border-color: var(--gold); }
  .intro-emoji-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .intro-emoji-btn:hover { border-color: var(--gold); }
  .intro-emoji-panel {
    display: none;
    position: absolute;
    top: 46px;
    right: 10px;
    width: 224px;
    max-height: 180px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 16px 34px -12px var(--shadow);
    z-index: 5;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .intro-emoji-panel.open { display: grid; }
  .intro-emoji-item {
    background: none;
    border: none;
    font-size: 17px;
    line-height: 1;
    padding: 5px 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .intro-emoji-item:hover { background: var(--surface-2); }
  .intro-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .intro-btn {
    font-family: var(--font-mono);
    font-size: 12.5px;
    letter-spacing: .03em;
    text-transform: uppercase;
    border-radius: 24px;
    padding: 11px 22px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--paper);
  }
  .intro-btn:hover { border-color: var(--gold); }
  .intro-btn.primary {
    background: var(--gold);
    color: #FFFFFF;
    border: none;
  }
  .intro-btn.primary:hover { filter: brightness(0.95); }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--sage);
  }

  .month-label {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(18px, 3vw, 24px);
    margin: 4px 0 0;
    color: var(--paper-dim);
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .nav-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s, transform .15s;
  }
  .nav-btn:hover { border-color: var(--gold); transform: translateY(-1px); }
  .nav-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .today-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--paper-dim);
    background: none;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .today-btn:hover { color: var(--gold); border-color: var(--gold); }

  .board {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 30px 60px -20px var(--shadow);
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 8px;
  }
  .weekdays div {
    font-family: var(--font-mono);
    font-size: 11px;
    text-align: center;
    color: var(--paper-dim);
    letter-spacing: .06em;
    text-transform: uppercase;
    padding-bottom: 6px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 96px;
    gap: 6px;
  }

  .cell {
    position: relative;
    border-radius: 10px;
    border: 1px solid transparent;
    background: var(--surface-2);
    cursor: pointer;
    padding: 8px;
    overflow: visible;
    transition: border-color .15s, background .15s;
  }
  .cell.empty { background: transparent; cursor: default; }
  .cell:not(.empty):hover { border-color: var(--gold); }
  .cell:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

  .cell.today { border-color: var(--sage); }
  .cell.today .daynum { color: var(--sage); }

  .daynum {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--paper-dim);
  }

  .heart-icon {
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);
    width: 44px;
    height: 44px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 3px 6px var(--shadow));
    z-index: 1;
  }

  .day-actions {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(255,255,255,0.9);
    border-radius: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
    z-index: 3;
  }
  .cell:hover .day-actions,
  .cell:focus-within .day-actions {
    opacity: 1;
    pointer-events: auto;
  }

  .day-action-btn {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--paper);
    padding: 5px 9px;
    border-radius: 14px;
    cursor: pointer;
  }
  .day-action-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .note-dot {
    position: absolute;
    bottom: 8px;
    left: 8px;
    right: 8px;
    font-family: var(--font-body);
    font-size: 10.5px;
    line-height: 1.25;
    color: var(--paper);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .marker {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
  }

  /* side panel */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(70,55,40,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .panel {
    position: fixed;
    top: 50%;
    left: 50%;
    height: auto;
    max-height: 85vh;
    width: min(400px, 90vw);
    background: linear-gradient(160deg, #FF7EC0, #FF4FA0);
    border: none;
    border-radius: 24px;
    box-shadow: 0 30px 70px -20px rgba(180,20,100,0.5);
    transform: translate(-50%, -50%) scale(0.94);
    opacity: 0;
    pointer-events: none;
    transition: transform .25s ease, opacity .2s ease;
    z-index: 11;
    padding: 28px 24px;
    overflow-y: auto;
  }
  .panel.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }

  .panel-date {
    font-family: var(--font-mono);
    font-size: 12px;
    color: rgba(74,16,48,0.75);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .panel-title {
    font-family: var(--font-display);
    font-size: 24px;
    margin: 4px 0 20px;
    color: #4A1030;
  }

  label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: rgba(74,16,48,0.75);
    margin-bottom: 6px;
  }

  .field-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .field-label-row label { margin-bottom: 6px; }

  .emoji-trigger {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.18);
    font-size: 13px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    margin-bottom: 6px;
  }
  .emoji-trigger:hover { background: rgba(255,255,255,0.3); }
  .emoji-trigger.active { border-color: #FFFFFF; background: rgba(255,255,255,0.35); }

  .emoji-panel {
    display: none;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 18px;
  }
  .emoji-panel.open { display: block; }
  .emoji-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: rgba(74,16,48,0.7);
    margin-bottom: 8px;
  }
  .emoji-panel-close {
    background: none;
    border: none;
    color: rgba(74,16,48,0.7);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
  }
  .emoji-panel-close:hover { color: #4A1030; }
  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
    max-height: 150px;
    overflow-y: auto;
  }
  .emoji-item {
    background: none;
    border: none;
    font-size: 19px;
    line-height: 1;
    padding: 5px 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .emoji-item:hover { background: rgba(255,255,255,0.35); }

  input[type="text"], textarea {
    width: 100%;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px;
    color: #4A1030;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 12px;
    margin-bottom: 18px;
    resize: vertical;
  }
  input[type="text"]::placeholder, textarea::placeholder { color: rgba(74,16,48,0.55); }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: #FFFFFF;
    background: rgba(255,255,255,0.24);
  }
  textarea { min-height: 90px; }

  .image-drop {
    border: 1px dashed rgba(255,255,255,0.45);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    margin-bottom: 18px;
    cursor: pointer;
    font-size: 12px;
    color: rgba(74,16,48,0.75);
  }
  .image-drop:hover { border-color: #FFFFFF; color: #4A1030; }
  .image-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .image-thumb-wrap {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    overflow: hidden;
  }
  .image-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .image-thumb-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(70,55,40,0.65);
    color: #FFFFFF;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb-move-btn {
    position: absolute;
    bottom: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: rgba(70,55,40,0.65);
    color: #FFFFFF;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .thumb-move-btn.left { left: 4px; }
  .thumb-move-btn.right { right: 4px; }
  .thumb-move-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .thumb-move-btn:not(:disabled):hover { background: rgba(70,55,40,0.9); }
  .image-add-tile {
    aspect-ratio: 1 / 1;
    border: 1px dashed rgba(255,255,255,0.45);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(74,16,48,0.75);
    font-size: 24px;
    cursor: pointer;
  }
  .image-add-tile:hover { border-color: #FFFFFF; color: #4A1030; }

  .upload-progress {
    display: none;
    margin-bottom: 18px;
  }
  .upload-progress-label {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .04em;
    color: rgba(74,16,48,0.8);
    margin-bottom: 6px;
    text-align: center;
  }
  .upload-progress-track {
    width: 100%;
    height: 8px;
    border-radius: 6px;
    background: rgba(255,255,255,0.35);
    overflow: hidden;
  }
  .upload-progress-fill {
    height: 100%;
    width: 0%;
    background: #FFFFFF;
    border-radius: 6px;
    transition: width .15s ease;
  }

  .storage-info {
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 18px;
  }
  .storage-info-text {
    font-family: var(--font-mono);
    font-size: 10.5px;
    line-height: 1.4;
    color: rgba(255,255,255,0.85);
    margin-bottom: 6px;
  }
  .storage-info-track {
    width: 100%;
    height: 5px;
    border-radius: 5px;
    background: rgba(255,255,255,0.25);
    overflow: hidden;
  }
  .storage-info-fill {
    height: 100%;
    width: 0%;
    background: #FFFFFF;
    border-radius: 5px;
    transition: width .2s ease;
  }
  .storage-info-fill.high { background: #FFD9E2; }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  button.primary {
    flex: 1;
    background: #FFFFFF;
    color: #C8368C;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(0.96); }

  button.ghost {
    background: none;
    border: 1px solid rgba(255,255,255,0.45);
    color: rgba(74,16,48,0.85);
    border-radius: 8px;
    padding: 11px 14px;
    font-family: var(--font-body);
    font-size: 13px;
    cursor: pointer;
  }
  button.ghost:hover { border-color: #FFFFFF; color: #4A1030; background: rgba(255,255,255,0.14); }

  .close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    color: rgba(74,16,48,0.75);
    font-size: 18px;
    cursor: pointer;
  }
  .close-btn:hover { color: #4A1030; }

  .heart-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    width: fit-content;
    max-width: min(640px, 92vw);
    transform: translate(-50%, -50%) scale(0.9);
    opacity: 0;
    pointer-events: none;
    transition: transform .25s ease, opacity .2s ease;
    z-index: 11;
  }
  .heart-popup.open {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }

  .heart-close-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: #FFFFFF;
    color: var(--gold);
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 6px 14px -6px var(--shadow);
    z-index: 2;
  }
  .heart-close-btn:hover { filter: brightness(0.96); }

  .heart-shape {
    position: relative;
    width: fit-content;
    max-width: 100%;
    max-height: 88vh;
    margin: 0 auto;
    border-radius: 28px;
    background: linear-gradient(160deg, #FF7EC0, #FF4FA0);
    box-shadow: 0 30px 70px -20px rgba(180,20,100,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 30px;
    box-sizing: border-box;
  }

  .heart-content {
    width: fit-content;
    max-width: min(400px, 78vw);
    max-height: 70vh;
    overflow-y: auto;
    overflow-x: hidden;
    text-align: center;
    padding: 0 16px;
    box-sizing: border-box;
  }
  .heart-date {
    font-family: var(--font-mono);
    font-size: clamp(11px, 2vw, 15px);
    text-transform: uppercase;
    letter-spacing: .06em;
    color: rgba(74,16,48,0.75);
    margin-bottom: 14px;
  }
  .heart-photo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 24px;
  }
  .heart-carousel {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .heart-carousel img {
    width: clamp(64px, 14vw, 130px);
    height: clamp(64px, 14vw, 130px);
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #FFFFFF;
    box-shadow: 0 8px 18px -6px rgba(0,0,0,0.3);
    cursor: pointer;
    display: block;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .heart-carousel:hover img {
    transform: translateY(-7px);
    box-shadow: 0 16px 26px -6px rgba(0,0,0,0.4);
  }
  .heart-photo-hint {
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #FFFFFF;
    background: rgba(0,0,0,0.4);
    padding: 3px 9px;
    border-radius: 10px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .heart-carousel:hover .heart-photo-hint {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .heart-carousel-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.9);
    color: var(--gold);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .heart-carousel-nav:hover { filter: brightness(0.95); }
  .heart-carousel-nav.prev { left: -6px; }
  .heart-carousel-nav.next { right: -6px; }
  .heart-carousel-dots {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  .heart-carousel-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
  }
  .heart-carousel-dot.active { background: #FFFFFF; }
  .heart-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(17px, 3vw, 26px);
    color: #4A1030;
    margin-bottom: 8px;
  }
  .heart-note {
    font-family: var(--font-body);
    font-size: clamp(13px, 1.8vw, 17px);
    line-height: 1.5;
    text-align: justify;
    color: rgba(74,16,48,0.85);
    word-break: break-word;
  }
  .heart-note p {
    margin: 0 0 0.7em;
    text-indent: 1.6em;
    white-space: pre-wrap;
  }
  .heart-note p:last-child { margin-bottom: 0; }

  .photo-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    width: fit-content;
    max-width: min(640px, 92vw);
    transform: translate(-50%, -50%) scale(0.9);
    opacity: 0;
    pointer-events: none;
    transition: transform .25s ease, opacity .2s ease;
    z-index: 12;
  }
  .photo-popup.open {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .photo-popup-img {
    width: auto;
    max-width: min(640px, 92vw);
    max-height: 82vh;
    object-fit: contain;
    border-radius: 22px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 30px 70px -20px rgba(180,20,100,0.5);
    background: #2a2422;
  }
  .photo-back-btn {
    position: absolute;
    top: -8px;
    left: -8px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: #FFFFFF;
    color: var(--gold);
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 6px 14px -6px var(--shadow);
    z-index: 2;
  }
  .photo-back-btn:hover { filter: brightness(0.96); }
  .photo-nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: #FFFFFF;
    color: var(--gold);
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 6px 14px -6px var(--shadow);
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo-nav-btn:hover { filter: brightness(0.96); }
  .photo-nav-btn.prev { left: -8px; }
  .photo-nav-btn.next { right: -8px; }

  .confirm-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(360px, 88vw);
    transform: translate(-50%, -50%) scale(0.9);
    opacity: 0;
    pointer-events: none;
    transition: transform .2s ease, opacity .2s ease;
    z-index: 13;
    background: linear-gradient(160deg, #FF7EC0, #FF4FA0);
    border-radius: 22px;
    box-shadow: 0 30px 70px -20px rgba(180,20,100,0.5);
    padding: 26px 24px;
    box-sizing: border-box;
    text-align: center;
  }
  .confirm-popup.open {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .confirm-popup-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    color: #FFFFFF;
    margin-bottom: 10px;
  }
  .confirm-popup-text {
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.5;
    color: rgba(255,255,255,0.9);
    margin-bottom: 20px;
  }
  .confirm-popup-actions {
    display: flex;
    gap: 10px;
  }
  .confirm-popup-actions .ghost,
  .confirm-popup-actions .primary {
    flex: 1;
  }

  .status {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--paper-dim);
    text-align: center;
    margin-top: 16px;
    min-height: 14px;
  }

  .panel-status {
    font-family: var(--font-mono);
    font-size: 11px;
    text-align: center;
    margin-top: 12px;
    min-height: 14px;
    color: rgba(255,255,255,0.85);
  }
  .panel-status.error {
    color: #FFE1EA;
    font-weight: 600;
  }

  @media (max-width: 480px) {

    position: fixed;
    bottom: 20px;
    right: 20px;

    gap: 10px;
    z-index: 5;

  .transfer-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--paper);
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: .03em;
    border-radius: 20px;
    padding: 9px 16px;
    cursor: pointer;
    box-shadow: 0 10px 24px -10px var(--shadow);

<body>

<div class="intro-page" id="introPage">
  <div class="intro-message-display" id="introMessageDisplay"></div>
  <div class="intro-textarea-wrap" id="introTextareaWrap" style="display:none">
    <textarea class="intro-textarea" id="introTextarea" placeholder="Escribí acá tu mensaje introductorio..."></textarea>
    <button type="button" class="intro-emoji-btn" id="introEmojiBtn" aria-label="Insertar emoji">🙂</button>
    <div class="intro-emoji-panel" id="introEmojiPanel"></div>
  </div>
  <div class="intro-actions">
    <button type="button" class="intro-btn" id="introEditBtn">Editar mensaje</button>
    <button type="button" class="intro-btn" id="introSaveBtn" style="display:none">Guardar</button>
    <button type="button" class="intro-btn primary" id="introContinueBtn">Entrar al calendario</button>
  </div>
</div>

<div class="wrap" id="calendarWrap" style="display:none">
  <div class="page-title">
    <h1 class="page-title-text">Nuestra gran historia de amor</h1>
  </div>

  <header>
    <div>
      <div class="eyebrow">Agenda visual</div>
      <div class="month-label" id="monthLabel">—</div>
    </div>
    <div class="month-nav">
      <button class="today-btn" id="todayBtn">Hoy</button>
      <button class="nav-btn" id="prevBtn" aria-label="Mes anterior">‹</button>
      <button class="nav-btn" id="nextBtn" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <div class="board">
    <div class="weekdays">
      <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="status" id="status"></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="panel" id="panel">
  <button class="close-btn" id="closeBtn">✕</button>
  <div class="panel-date" id="panelDate"></div>
  <div class="panel-title" id="panelTitle">Editar fecha</div>

  <div class="field-label-row">
    <label for="titleInput">Título</label>
    <button type="button" class="emoji-trigger" id="emojiBtnTitle" aria-label="Insertar emoji en el título">🙂</button>
  </div>
  <input type="text" id="titleInput" placeholder="Ej. Entrevista de trabajo">

  <div class="field-label-row">
    <label for="noteInput">Notas</label>
    <button type="button" class="emoji-trigger" id="emojiBtnNote" aria-label="Insertar emoji en la nota">🙂</button>
  </div>
  <textarea id="noteInput" placeholder="Detalles, recordatorios, lo que quieras anotar..."></textarea>

  <div class="emoji-panel" id="emojiPanel">
    <div class="emoji-panel-header">
      <span>Emojis</span>
      <button type="button" class="emoji-panel-close" id="emojiPanelClose" aria-label="Cerrar emojis">✕</button>
    </div>
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>

  <label>Imagen</label>
  <div id="imageArea"></div>
  <div class="upload-progress" id="uploadProgress">
    <div class="upload-progress-label" id="uploadProgressLabel">Cargando...</div>
    <div class="upload-progress-track">
      <div class="upload-progress-fill" id="uploadProgressFill"></div>
    </div>
  </div>
  <div class="storage-info" id="storageInfo">
    <div class="storage-info-text" id="storageInfoText">Calculando espacio disponible…</div>
    <div class="storage-info-track">
      <div class="storage-info-fill" id="storageInfoFill"></div>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none">

  <div class="actions">
    <button class="primary" id="saveBtn">Guardar</button>
    <button class="ghost" id="deleteBtn">Borrar</button>
  </div>
  <div class="panel-status" id="panelStatus"></div>
</div>

<div class="heart-popup" id="heartPopup">
  <button class="heart-close-btn" id="heartCloseBtn">✕</button>
  <div class="heart-shape">
    <div class="heart-content">
      <div class="heart-date" id="heartDate"></div>
      <div class="heart-photo-wrap" id="heartPhotoWrap"></div>
      <div class="heart-title" id="heartTitleText"></div>
      <div class="heart-note" id="heartNoteText"></div>
    </div>
  </div>
</div>

<div class="photo-popup" id="photoPopup">
  <button class="photo-back-btn" id="photoBackBtn" aria-label="Volver">←</button>
  <button class="photo-nav-btn prev" id="photoPrevBtn" aria-label="Anterior">‹</button>
  <img class="photo-popup-img" id="photoPopupImg" alt="">
  <button class="photo-nav-btn next" id="photoNextBtn" aria-label="Siguiente">›</button>
</div>

<div class="confirm-popup" id="confirmDeletePopup">
  <div class="confirm-popup-title">¿Borrar esta fecha?</div>
  <div class="confirm-popup-text">Se va a eliminar el título, la nota y las fotos que subiste para este día. Esta acción no se puede deshacer.</div>
  <div class="confirm-popup-actions">
    <button type="button" class="ghost" id="confirmDeleteCancel">Cancelar</button>
    <button type="button" class="primary" id="confirmDeleteConfirm">Sí, borrar</button>
  </div>
</div>

<div class="transfer-bar">
  <button class="transfer-btn" id="exportBtn">⭳ Exportar</button>
  <button class="transfer-btn" id="importBtn">⭱ Importar</button>
  <button class="transfer-btn" id="cleanVideosBtn">🧹 Limpiar videos</button>
  <input type="file" id="importFileInput" accept="application/json" style="display:none">
</div>

  const IDB_NAME = 'agenda-visual-db';
  const IDB_VERSION = 1;
  const IDB_STORE = 'months';
  let idbPromise = null;

  function openDB(){
    if (idbPromise) return idbPromise;
    idbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB){ reject(new Error('IndexedDB no disponible')); return; }
      const req = indexedDB.open(IDB_NAME, IDB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return idbPromise;
  }

  function idbGet(key){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }));
  }

  function idbSet(key, value){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    }));
  }

  function idbGetAllEntries(){
    return openDB().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const result = {};
      const req = store.openCursor();
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor){ result[cursor.key] = cursor.value; cursor.continue(); }
        else resolve(result);
      };
      req.onerror = () => reject(req.error);
    }));
  }

  async function migrateLocalStorageToIndexedDB(){
    const FLAG = 'calendar-migrated-idb-v1';
    try {
      if (localStorage.getItem(FLAG)) return;
      const keysToMigrate = [];
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf('calendar-month:') === 0) keysToMigrate.push(k);
      }
      for (const k of keysToMigrate){
        try {
          const raw = localStorage.getItem(k);
          const parsed = raw ? JSON.parse(raw) : {};
          await idbSet(k, parsed);
          localStorage.removeItem(k);
        } catch (e) { /* si falla una clave, seguimos con las demás */ }
      }
      localStorage.setItem(FLAG, '1');
    } catch (e) { /* localStorage no disponible, se ignora */ }
  }

  async function cleanupVideosNow(){
    let removedCount = 0;
    const all = await idbGetAllEntries();
    for (const monthKeyStr of Object.keys(all)){
      const monthObj = all[monthKeyStr] || {};
      let changed = false;
      for (const dayKeyStr of Object.keys(monthObj)){
        const entry = monthObj[dayKeyStr];
        if (entry && entry.media){
          const before = entry.media.length;
          entry.media = entry.media.filter(m => m && m.type !== 'video');
          const removedHere = before - entry.media.length;
          if (removedHere > 0){ changed = true; removedCount += removedHere; }
        }
      }
      if (changed) await idbSet(monthKeyStr, monthObj);
    }
    return removedCount;
  }

  async function removeAllStoredVideos(){
    const FLAG = 'calendar-videos-removed-v1';
    try {
      if (localStorage.getItem(FLAG)) return;
      await cleanupVideosNow();
      localStorage.setItem(FLAG, '1');
    } catch (e) { /* ignorar */ }
  }

  async function loadMonth(){
    setStatus('Cargando...');
    try {
      const data = await idbGet(monthKey(viewYear, viewMonth));
      monthData = data || {};
    } catch (e) {
      monthData = {};
    }
    Object.keys(monthData).forEach(k => {
      const e = monthData[k];
      if (!e) return;
      if (e.media) {
        // ya está en formato nuevo
      } else if (e.images && e.images.length) {
        e.media = e.images.map(src => ({ type: 'image', src }));
      } else if (e.image) {
        e.media = [{ type: 'image', src: e.image }];
      } else {
        e.media = [];
      }
      delete e.image;
      delete e.images;
    });
    setStatus('');
    render();
  }

  async function saveMonth(){
    await idbSet(monthKey(viewYear, viewMonth), monthData);
  }

  async function getAllCalendarData(){

  function angleFor(day){
    return ((day * 37) % 15) - 7;

  function render(){
    monthLabel.textContent = monthNames[viewMonth] + ' ' + viewYear;
    grid.innerHTML = '';

    const firstOfMonth = new Date(viewYear, viewMonth, 1);
    const offset = (firstOfMonth.getDay() + 6) % 7; // Monday = 0
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    for (let i = 0; i < offset; i++){
      const empty = document.createElement('div');
      empty.className = 'cell empty';
      grid.appendChild(empty);
    }

    for (let day = 1; day <= daysInMonth; day++){
      const key = pad(day);
      const entry = monthData[key];
      const hasEntry = !!(entry && (entry.title || entry.note || (entry.media && entry.media.length)));
      const cell = document.createElement('div');
      cell.className = 'cell';

      const isToday = viewYear === today.getFullYear() && viewMonth === today.getMonth() && day === today.getDate();
      if (isToday) cell.classList.add('today');

      const num = document.createElement('div');
      num.className = 'daynum';
      num.textContent = day;
      cell.appendChild(num);

      if (hasEntry) {
        const icon = document.createElement('div');
        icon.className = 'heart-icon';
        icon.style.backgroundImage = `url(${HEART_ICON})`;
        cell.appendChild(icon);
      }

      const actions = document.createElement('div');
      actions.className = 'day-actions';

      if (hasEntry) {
        const viewBtn = document.createElement('button');
        viewBtn.type = 'button';
        viewBtn.className = 'day-action-btn';
        viewBtn.textContent = 'Ver';
        viewBtn.addEventListener('click', (e) => { e.stopPropagation(); openViewPopup(day); });
        actions.appendChild(viewBtn);
      }

      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'day-action-btn';
      editBtn.textContent = 'Editar';
      editBtn.addEventListener('click', (e) => { e.stopPropagation(); openPanel(day); });
      actions.appendChild(editBtn);

      cell.appendChild(actions);

      grid.appendChild(cell);
    }

  async function getStorageSnapshot(){
    try {
      if (navigator.storage && navigator.storage.estimate){
        const est = await navigator.storage.estimate();
        if (est && typeof est.usage === 'number' && typeof est.quota === 'number' && est.quota > 0){
          return { usage: est.usage, quota: est.quota, real: true };
        }
      }
    } catch (e) { /* API no disponible, seguimos con el cálculo manual */ }

    // Fallback: medir el contenido guardado en IndexedDB
    let bytes = 0;
    try {
      const all = await idbGetAllEntries();
      Object.values(all).forEach(monthObj => {
        Object.values(monthObj || {}).forEach(entry => {
          if (!entry) return;
          bytes += (entry.title ? entry.title.length : 0) + (entry.note ? entry.note.length : 0);
          if (entry.media){
            entry.media.forEach(m => {
              if (m.src) bytes += m.src.length;
            });
          }
        });
      });
    } catch (e) { /* ignorar */ }
    return { usage: bytes, quota: 50 * 1024 * 1024, real: false }; // 50 MB: piso conservador típico de IndexedDB
  }

  async function averageImageBytes(){
    const samples = [];
    pendingMedia.forEach(m => { if (m.type === 'image' && m.src) samples.push(m.src.length); });

    if (samples.length === 0){
      try {
        const all = await idbGetAllEntries();
        Object.values(all).forEach(data => {
          Object.values(data || {}).forEach(entry => {
            if (samples.length >= 12) return;
            if (entry && entry.media){
              entry.media.forEach(m => { if (samples.length < 12 && m.type === 'image' && m.src) samples.push(m.src.length); });
            }
          });
        });
      } catch (e) { /* ignorar */ }
    }

    if (samples.length > 0){
      return samples.reduce((a, b) => a + b, 0) / samples.length;
    }
    return 700 * 1024; // sin datos propios: asumir ~700 KB por foto ya codificada
  }

  async function refreshStorageInfo(){
    if (!storageInfoText) return;
    const { usage, quota, real } = await getStorageSnapshot();
    const freeBytes = Math.max(quota - usage, 0);
    const avgBytes = await averageImageBytes();
    const estRemaining = avgBytes > 0 ? Math.floor(freeBytes / avgBytes) : 0;
    const usedMB = (usage / (1024 * 1024)).toFixed(1);
    const quotaMB = (quota / (1024 * 1024)).toFixed(1);
    const pct = quota > 0 ? Math.min(100, Math.round((usage / quota) * 100)) : 0;

    storageInfoFill.style.width = pct + '%';
    storageInfoFill.classList.toggle('high', pct >= 80);

    let text = 'Espacio usado: ' + usedMB + ' MB de ~' + quotaMB + ' MB';
    text += ' · alcanza para ~' + estRemaining + (estRemaining === 1 ? ' foto más' : ' fotos más');
    if (!real) text += ' (estimado)';
    storageInfoText.textContent = text;
  }

  function updateUploadProgress(pct, completed, total){
    uploadProgress.style.display = 'block';
    uploadProgressFill.style.width = pct + '%';
    uploadProgressLabel.textContent = 'Cargando ' + completed + '/' + total + ' archivo' + (total === 1 ? '' : 's') + ' · ' + pct + '%';

  fileInput.addEventListener('change', () => {
    const files = Array.from(fileInput.files || []).filter(f => f.type && f.type.indexOf('image/') === 0);
    if (files.length === 0){ fileInput.value = ''; return; }
    const startLen = pendingMedia.length;

    const totalBytes = files.reduce((sum, f) => sum + f.size, 0) || 1;
    const loadedBytes = files.map(() => 0);
    let completed = 0;

    updateUploadProgress(0, 0, files.length);

    function reportProgress(){
      const sumLoaded = loadedBytes.reduce((sum, v) => sum + v, 0);
      const pct = Math.min(100, Math.round((sumLoaded / totalBytes) * 100));
      updateUploadProgress(pct, completed, files.length);
    }

    files.forEach((file, i) => {
      const reader = new FileReader();
      reader.onprogress = (e) => {
        loadedBytes[i] = e.lengthComputable ? e.loaded : file.size;
        reportProgress();
      };
      reader.onload = () => {
        loadedBytes[i] = file.size;
        pendingMedia[startLen + i] = { type: 'image', src: reader.result };
        completed++;
        reportProgress();
        if (completed === files.length) { hideUploadProgress(); renderImageArea(); }
      };
      reader.onerror = () => {
        loadedBytes[i] = file.size;
        completed++;
        reportProgress();
        if (completed === files.length) { hideUploadProgress(); renderImageArea(); }
      };
      reader.readAsDataURL(file);
    });
    fileInput.value = '';
  });

    let excludedVideos = 0;
    for (const monthKeyStr of Object.keys(data)){

      for (const dayKeyStr of Object.keys(monthObj)){
        const entry = monthObj[dayKeyStr];
        if (entry && entry.media){
          const before = entry.media.length;
          entry.media = entry.media.filter(m => m && m.type !== 'video');
          excludedVideos += (before - entry.media.length);
        }

    return { data, excludedVideos };

    try { localStorage.setItem(INTRO_MSG_KEY, introTextarea.value); } catch (e) { /* ignorar */ }
    introMessageDisplay.style.display = 'block';
    introTextareaWrap.style.display = 'none';
    introEmojiPanel.classList.remove('open');
    introEditBtn.style.display = 'inline-block';
    introSaveBtn.style.display = 'none';
    renderIntroMessage();
  });

  introContinueBtn.addEventListener('click', () => {
    if (introTextareaWrap.style.display === 'block'){
      try { localStorage.setItem(INTRO_MSG_KEY, introTextarea.value); } catch (e) { /* ignorar */ }
    }
    introEmojiPanel.classList.remove('open');
    introPage.style.display = 'none';
    calendarWrap.style.display = 'block';
  });

  async function applyBackupPayload(parsed){
    const data = parsed && parsed.data ? parsed.data : parsed;
    const keys = Object.keys(data || {});
    for (const k of keys){
      if (k.indexOf('calendar-month:') === 0){
        await idbSet(k, data[k]);
      }
    }
    if (parsed && typeof parsed.introMessage === 'string' && parsed.introMessage.trim()){
      try { localStorage.setItem(INTRO_MSG_KEY, parsed.introMessage); } catch (e) { /* ignorar */ }
      renderIntroMessage();
    }
  }

  async function fetchAndApplyBackup(url){
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) return false;
    const parsed = await res.json();
    await applyBackupPayload(parsed);
    return true;
  }

  async function autoImportBackupIfPresent(){
    const FLAG = 'calendar-auto-import-v8';
    const BACKUP_URL = 'https://raw.githubusercontent.com/JasonJordanP/OurLoveStory/main/agenda-visual-backup.json';
    try {
      if (localStorage.getItem(FLAG)) return;
      await fetchAndApplyBackup(BACKUP_URL);
      localStorage.setItem(FLAG, '1');
    } catch (e) {
      // sin conexión, sin archivo, bloqueo de CORS, o formato inválido: no hacemos nada
      try { localStorage.setItem(FLAG, '1'); } catch (e2) { /* ignorar */ }
    }
  }

  (async () => {
    await migrateLocalStorageToIndexedDB();
    await removeAllStoredVideos();
    await autoImportBackupIfPresent();
    await seedBrokenHeartDay();
    await loadMonth();
  })();
})();
</script>
